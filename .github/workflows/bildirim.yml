name: BIST otomatik bildirim

on:
  schedule:
    # GitHub zamanlanmış işleri 1-2 saat geciktirebiliyor. Bu yüzden
    # 18:10-20:55 İstanbul arası 15 dakikada bir denenir; otomasyon.py
    # "--gunluk" modu sayesinde 18:40'tan önce göndermez ve günde
    # yalnızca BİR kez gönderir (gonderim.json ile takip).
    # Dakikalar 18:40'a denk gelecek şekilde hizalandı (UTC+3).
    - cron: '10,25,40,55 15-17 * * 1-5'
  workflow_dispatch: {}
  # Dış zamanlayıcı (cron-job.org) buradan tetikler — GitHub'ın kendi
  # zamanlayıcısı geciktiğinde/atladığında garanti çalışması için.
  repository_dispatch:
    types: [gunluk-bildirim]

permissions:
  contents: write        # gonderim.json'u repoya geri yazabilmek için

concurrency:
  group: bist-bildirim
  cancel-in-progress: false

jobs:
  bildir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Vakti gelmişse tara ve Telegram'a yolla
        run: python otomasyon.py --gunluk    # tarama + performans mesajı
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Gönderim kaydını sakla
        run: |
          if [ -n "$(git status --porcelain gonderim.json taramalar/)" ]; then
            git config user.name "bist-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -f gonderim.json taramalar/
            git commit -m "gönderim kaydı [skip ci]"
            git push
          else
            echo "değişiklik yok"
          fi
